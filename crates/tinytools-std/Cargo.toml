[package]
name = "tinytools-std"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-independent building blocks for agent tools: cross-agent file staleness tracking, SSRF-safe URL validation, shell-command failure rendering, and PATH probing."
documentation = "https://docs.rs/tinytools-std"
readme = "README.md"
publish = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
log = "0.4"
parking_lot = "0.12"
serde_json = { workspace = true }
tinytools = { path = "../tinytools", version = "0.4.1" }
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
